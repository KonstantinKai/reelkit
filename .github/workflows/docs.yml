name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'scripts/docs-probe.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm exec nx build docs
        env:
          VITE_STACKBLITZ_CDN_TOKEN: ${{ secrets.STACKBLITZ_CDN_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/dist/docs

      # The same build, for the Cloudflare Workers deploy below. The GitHub
      # Pages artifact is a tarball meant for Pages only.
      - name: Upload build for Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: ./apps/dist/docs
          include-hidden-files: true
          retention-days: 1

  # Serves the docs from Cloudflare Workers static assets on its workers.dev
  # address while reelkit.dev still points at GitHub Pages.
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: ./apps/dist/docs

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'

      # Wrangler comes from the workspace lockfile. Left to install its own,
      # the action would run npm inside apps/docs, which cannot resolve the
      # workspace dependencies declared there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/docs/wrangler.jsonc

      # A newly deployed version can take a few seconds to answer everywhere,
      # so the probe gets a short grace period before it counts as a failure.
      - name: Probe the deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "wrangler reported no deployment URL"; exit 1; }
          for attempt in 1 2 3 4 5 6; do
            node scripts/docs-probe.mjs "$DEPLOYMENT_URL" --dist apps/dist/docs && exit 0
            echo "probe attempt $attempt failed, retrying in 20 seconds"
            sleep 20
          done
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
