name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'scripts/docs-probe.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time and never cancel each other, so the Worker always
# ends up on the build of the latest finished run.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm exec nx build docs
        env:
          VITE_STACKBLITZ_CDN_TOKEN: ${{ secrets.STACKBLITZ_CDN_TOKEN }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: ./apps/dist/docs
          include-hidden-files: true
          retention-days: 1

  # Serves reelkit.dev from Cloudflare Workers static assets, with the
  # language redirect at the edge.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: ./apps/dist/docs

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'

      # Wrangler comes from the workspace lockfile. Left to install its own,
      # the action would run npm inside apps/docs, which cannot resolve the
      # workspace dependencies declared there.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/docs/wrangler.jsonc

      # A newly deployed version can take a few seconds to answer everywhere,
      # so the probe gets a short grace period before it counts as a failure.
      # The Worker answers on its custom domain only, so the probe checks the
      # production site itself.
      - name: Probe the deployment
        run: |
          for attempt in 1 2 3 4 5 6; do
            node scripts/docs-probe.mjs https://reelkit.dev --dist apps/dist/docs && exit 0
            echo "probe attempt $attempt failed, retrying in 20 seconds"
            sleep 20
          done
          exit 1
